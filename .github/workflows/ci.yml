name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Проверка синтаксиса (Lint)
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint || true

  # 2. Анализ кода в SonarQube
  SonarQube:
    runs-on: ubuntu-latest
    needs: Lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 3. Сканирование безопасности (Trivy)
  Trivy_Security_Scan:
    runs-on: ubuntu-latest
    needs: Lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'

  # 4. Сборка Docker-образа (Build)
  Build:
    runs-on: ubuntu-latest
    needs: [SonarQube, Trivy_Security_Scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t flower-shop:latest .
