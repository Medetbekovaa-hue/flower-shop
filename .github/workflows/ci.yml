name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Проверка синтаксиса кода
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint || true

  # 2. Сканирование безопасности через Trivy
  Trivy_Security_Scan:
    runs-on: ubuntu-latest
    needs: Lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'

  # 3. Финальная сборка Docker-образа
  Build:
    runs-on: ubuntu-latest
    needs: Trivy_Security_Scan
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t flower-shop:latest .
